name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aurelia_studio_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/aurelia_studio_test?schema=public
      AUTH_SECRET: ci-only-auth-secret-not-for-any-deployed-environment
      RATE_LIMIT_SECRET: ci-only-rate-limit-secret-not-for-any-deployment
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aurelia_studio_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aurelia_studio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run db:smoke
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
