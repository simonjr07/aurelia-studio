name: aurelia-studio

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aurelia_studio_dev
      POSTGRES_USER: aurelia_dev
      POSTGRES_PASSWORD: aurelia_local_password
    ports:
      - "5434:5432"
    volumes:
      - aurelia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurelia_dev -d aurelia_studio_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  aurelia_postgres_data:
